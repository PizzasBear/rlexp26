[package]
name = "expreplay"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]
name = "expreplay"

[dependencies]
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
half = { version = "2.7.1", features = ["bytemuck"] }
ndarray = { version = "0.17.2", features = ["rayon"] }
numpy = { version = "0.29.0", features = ["half"] }
pyo3 = { version = "0.29.0", features = ["abi3-py312"] }
rand = "0.10.2"
thiserror = "2.0.20"

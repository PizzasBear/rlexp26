[project]
name = "rlexp26"
version = "0.1.0"
description = "My 2026 RL Experiment"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Max S.", email = "gmx.sht@gmail.com" }]
dependencies = [
    "ale-py>=0.12.1",
    "envpool>=1.2.5",
    "flax>=0.12.9",
    "gymnasium[box2d,mujoco,other]==1.3.0",
    "jax>=0.11.1",
    "optax>=0.2.8",
]

[project.scripts]
rlexp26 = "rlexp26:main"

[project.optional-dependencies]
cuda13 = ["jax[cuda13]"]

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "mypy>=2.3.1",
    "rlexp26[cuda13]",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "basic"
